<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>染色</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  @font-face{
    font-family:'ラノベPOPフォント';
    src:url('https://cdn.leafscape.be/NovelPOP/novelpop_web.woff2') format('woff2');
    font-display:swap;
  }
  :root{
    --ink:#1a1a1a;
    --line:#111111;
    --paper-bg:#ffffff;
    --panel:#ffffff;
    --err:#c0392b;
    --ok:#1a7a4c;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    min-height:100%;
    background:#ffffff;
    color-scheme: light;
    font-family:'ラノベPOPフォント','Zen Kaku Gothic New', sans-serif;
    color:var(--ink);
    display:flex;
    justify-content:center;
  }
  .stage{
    width:100%;
    max-width:640px;
    padding:28px 16px 48px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .title{
    font-weight:900;
    font-size:clamp(24px,5vw,34px);
    margin:0 0 18px;
    letter-spacing:.06em;
  }

  .bubble{
    position:relative;
    background:#fff;
    color:var(--ink);
    font-weight:700;
    font-size:14px;
    padding:12px 18px;
    border:2px solid var(--line);
    margin-bottom:14px;
    text-align:center;
    max-width:90%;
  }
  .bubble::after{
    content:"";
    position:absolute;
    left:50%;
    bottom:-10px;
    transform:translateX(-50%);
    width:16px;height:16px;
    background:#fff;
    border-right:2px solid var(--line);
    border-bottom:2px solid var(--line);
    transform:translateX(-50%) rotate(45deg);
  }
  .bubble.hidden{display:none;}

  .sheet-frame{
    width:100%;
    max-width:420px;
    border:3px solid var(--line);
    overflow:hidden;
    background:#000;
    touch-action:none;
    transition:opacity .2s ease;
  }
  .sheet-frame.placed{opacity:.15;pointer-events:none;}
  .sheet-frame svg{display:block;width:100%;height:auto;}
  .clue-num{
    font-family:'ラノベPOPフォント','Zen Kaku Gothic New', sans-serif;
    font-weight:700;
    fill:#fff;
    text-anchor:middle;
  }
  .fillable{
    transform-box: fill-box;
    transform-origin: 50% 100%;
    transform: scaleY(0);
    transition: transform .55s cubic-bezier(.22,.9,.32,1);
  }

  .workbench{
    width:100%;
    max-width:420px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-top:18px;
  }
  .tool{
    width:64px;
    height:64px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#fff;
    border:2px solid var(--line);
  }
  .tool img{width:80%;height:80%;object-fit:contain;cursor:default;}
  .tool img.drag-ready{touch-action:none;cursor:grab;}
  .tool img.placed{opacity:.15;pointer-events:none;}

  .frame-box{
    flex:1;
    min-height:64px;
    position:relative;
    background:#fff;
    border:2px dashed var(--line);
    padding:6px;
  }

  .palette{
    width:100%;
    max-width:420px;
    display:flex;
    gap:12px;
    justify-content:center;
    margin-top:14px;
    flex-wrap:wrap;
  }
  .palette img{
    width:52px;
    height:52px;
    object-fit:contain;
    padding:6px;
    background:#fff;
    border:2px solid var(--line);
    cursor:grab;
    touch-action:none;
    transition:transform .15s ease, opacity .15s ease;
  }
  .palette img:active{transform:scale(.94);}
  .palette img.placed{
    opacity:.25;
    cursor:default;
    pointer-events:none;
  }
  .frame-item{width:40px;height:40px;object-fit:contain;cursor:grab;position:absolute;touch-action:none;}

  .btn-row{
    display:flex;
    gap:10px;
    margin-top:18px;
    flex-wrap:wrap;
    justify-content:center;
  }
  @property --p{
    syntax: '<angle>';
    inherits: false;
    initial-value: 0deg;
  }
  .wash-spinner{
    --p:0deg;
    --spin-color:#c0392b;
    position:absolute;
    top:-8px;
    right:-8px;
    width:28px;
    height:28px;
    border-radius:50%;
    border:3px solid var(--line);
    background:conic-gradient(var(--spin-color) var(--p), #fff var(--p));
    opacity:0;
    pointer-events:none;
    transition:--p 1.6s linear, opacity .12s ease;
  }
  .wash-spinner.active{opacity:1;}

  .action-btn{
    font-family:'ラノベPOPフォント','Zen Kaku Gothic New', sans-serif;
    font-weight:700;
    font-size:16px;
    border:2px solid var(--line);
    padding:12px 34px;
    cursor:pointer;
    background:var(--line);
    color:#fff;
  }
  .action-btn:disabled{
    opacity:.35;
    cursor:not-allowed;
  }
  .reset-btn{
    font-family:'ラノベPOPフォント','Zen Kaku Gothic New', sans-serif;
    font-weight:700;
    font-size:14px;
    border:2px solid var(--line);
    padding:12px 22px;
    cursor:pointer;
    background:#fff;
    color:var(--ink);
  }

  .toast{
    margin-top:12px;
    min-height:18px;
    font-size:13px;
    font-weight:700;
    text-align:center;
    color:#666;
  }
  .toast.ok{color:var(--ok);}
  .toast.err{color:var(--err);}

  .answer-box{
    margin-top:26px;
    padding:20px 22px;
    background:#fff;
    border:2px solid var(--line);
    width:100%;
    max-width:360px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .answer-box.hidden{display:none;}
  .footnote{
    margin-top:24px;
    font-size:11px;
    color:#999;
    text-align:center;
  }
  .answer-box label{
    font-weight:700;
    font-size:13px;
    color:var(--ink);
    letter-spacing:.05em;
    margin-bottom:10px;
  }
  .answer-row{display:flex;gap:8px;width:100%;}
  #answerInput{
    flex:1;
    min-width:0;
    padding:10px 14px;
    border:2px solid var(--line);
    background:#fff;
    color:var(--ink);
    font-family:'ラノベPOPフォント','Zen Kaku Gothic New', sans-serif;
    font-size:15px;
    letter-spacing:.08em;
    text-align:center;
    outline:none;
  }
  #answerInput:disabled{
    background:#eee;
    color:#999;
    cursor:not-allowed;
  }
  #answerSubmit{
    font-family:'ラノベPOPフォント','Zen Kaku Gothic New', sans-serif;
    font-weight:700;
    font-size:14px;
    border:2px solid var(--line);
    padding:10px 20px;
    cursor:pointer;
    background:var(--line);
    color:#fff;
  }
  #answerSubmit:disabled{
    background:#eee;
    color:#999;
    border-color:#ccc;
    cursor:not-allowed;
  }
  .answer-status{margin-top:10px;font-size:12px;min-height:16px;text-align:center;}
  .answer-status.correct{color:var(--ok);}
  .answer-status.wrong{color:var(--err);}

  .help-btn{
    position:fixed;
    top:16px;
    right:16px;
    width:34px;
    height:34px;
    border:2px solid var(--line);
    background:#fff;
    color:var(--ink);
    font-weight:900;
    font-size:16px;
    cursor:pointer;
    z-index:500;
  }
  .help-panel{
    position:fixed;
    top:56px;
    right:16px;
    max-width:240px;
    background:#fff;
    border:2px solid var(--line);
    padding:14px;
    font-size:13px;
    line-height:1.7;
    z-index:500;
  }
  .help-panel.hidden{display:none;}
  .help-close{
    margin-top:10px;
    display:block;
    border:2px solid var(--line);
    background:var(--line);
    color:#fff;
    font-family:'ラノベPOPフォント','Zen Kaku Gothic New', sans-serif;
    font-weight:700;
    font-size:12px;
    padding:6px 14px;
    cursor:pointer;
  }

  .success-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:1000;
    padding:20px;
  }
  .success-overlay.hidden{display:none;}
  .success-card{
    background:#fff;
    border:3px solid var(--line);
    padding:32px 26px;
    max-width:340px;
    width:100%;
    text-align:center;
  }
  .success-card h2{
    margin:0 0 10px;
    font-size:30px;
    letter-spacing:.06em;
  }
  .success-card p{
    margin:0 0 20px;
    font-size:14px;
    color:#333;
  }
  .success-card .retry-count{
    font-weight:900;
    font-size:18px;
  }
  .success-actions{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .success-actions button{
    font-family:'ラノベPOPフォント','Zen Kaku Gothic New', sans-serif;
    font-weight:700;
    font-size:14px;
    border:2px solid var(--line);
    padding:12px;
    cursor:pointer;
  }
  #shareBtn{background:var(--line); color:#fff;}
  #successCloseBtn{background:#fff; color:var(--ink);}
  .share-note{
    margin-top:10px;
    font-size:11px;
    color:#666;
    min-height:14px;
  }

  @keyframes shakeScreen{
    0%,100%{transform:translateX(0);}
    15%{transform:translateX(-10px);}
    30%{transform:translateX(9px);}
    45%{transform:translateX(-7px);}
    60%{transform:translateX(6px);}
    75%{transform:translateX(-4px);}
    90%{transform:translateX(2px);}
  }
  .stage.shake{animation:shakeScreen .5s ease;}

  .help-btn{
    position:fixed;
    top:16px;
    right:16px;
    width:34px;
    height:34px;
    border:2px solid var(--line);
    background:#fff;
    color:var(--ink);
    font-family:'ラノベPOPフォント','Zen Kaku Gothic New', sans-serif;
    font-weight:700;
    font-size:16px;
    cursor:pointer;
    z-index:100;
  }
  .help-panel{
    position:fixed;
    top:56px;
    right:16px;
    max-width:230px;
    background:#fff;
    border:2px solid var(--line);
    padding:12px 14px;
    font-size:13px;
    line-height:1.6;
    text-align:left;
    z-index:100;
  }
  .help-panel.hidden{display:none;}
</style>
</head>
<body>
<button class="help-btn" id="helpBtn" aria-label="せつめい">?</button>
<div class="help-panel hidden" id="helpPanel">
  <p>特殊な絵の具なので、一度塗った色は上書きされません。</p>
  <button class="help-close" id="helpClose">閉じる</button>
</div>
<div class="stage" id="stageRoot">
  <h1 class="title">染色</h1>

  const TUBE_LABEL = { red:"赤", white:"白", midori:"緑", bule:"青" };

  // ---- grid geometry (measured directly from the paper photo's pixels) ----
  const CIRCLE_CX = 63, CIRCLE_R = 37;
  const SQ_FILL = 76;
  const SQ_START_CX = 175, SQ_SPACING = 112;
  const ROWS = [
    { y: 164, squares: 3 },
    { y: 322, squares: 5 },
    { y: 478, squares: 4 },
    { y: 635, squares: 5 }
  ];

  const NS = "http://www.w3.org/2000/svg";
  function el(tag, attrs){
    const e = document.createElementNS(NS, tag);
    for(const k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }

  const markLayer = document.getElementById('markLayer');
  const circles = {};   // circles[row] = {fillEl}
  const squares = {};   // squares[row][index] = {fillEl, textEl}

  ROWS.forEach((row, rIdx)=>{
    const rowNum = rIdx + 1;
    const cCircle = el('circle', {cx:CIRCLE_CX, cy:row.y, r:CIRCLE_R, fill:'none', class:'fillable'});
    markLayer.appendChild(cCircle);
    circles[rowNum] = cCircle;

    squares[rowNum] = [];
    for(let i=0;i<row.squares;i++){
      const cx = SQ_START_CX + i*SQ_SPACING;
      const rect = el('rect', {
        x: cx - SQ_FILL/2, y: row.y - SQ_FILL/2,
        width: SQ_FILL, height: SQ_FILL, fill:'none', class:'fillable'
      });
      const text = el('text', {
        x: cx, y: row.y + 12, class:'clue-num', 'font-size':'34'
      });
      markLayer.appendChild(rect);
      markLayer.appendChild(text);
      squares[rowNum].push({rect, text});
    }
  });

  function fillIn(shapeEl, color){
    shapeEl.setAttribute('fill', color);
    // force reflow so the browser registers the starting (scaleY(0)) state
    // before we animate to scaleY(1) — otherwise the transition is skipped.
    void shapeEl.getBoundingClientRect();
    requestAnimationFrame(()=>{ shapeEl.style.transform = 'scaleY(1)'; });
  }

  function paintCircle(row, color){ fillIn(circles[row], color); }
  function paintCircleInstant(row, color){
    const c = circles[row];
    c.style.transition = 'none';
    c.setAttribute('fill', color);
    c.style.transform = 'scaleY(1)';
    void c.getBoundingClientRect();
    c.style.transition = '';
  }
  function labelSquare(row, idx1based, chars, color){
    const { text } = squares[row][idx1based-1];
    text.textContent = '';
    text.style.opacity = '0';
    text.style.transition = 'opacity .35s ease';
    text.style.fill = color;
    setTimeout(()=>{
      text.textContent = chars;
      requestAnimationFrame(()=>{ text.style.opacity = '1'; });
    }, 400);
  }
  function labelSquareInstant(row, idx1based, chars, color){
    const { text } = squares[row][idx1based-1];
    text.style.transition = 'none';
    text.style.fill = color;
    text.textContent = chars;
    text.style.opacity = '1';
    void text.getBoundingClientRect();
    text.style.transition = '';
  }
  function resetMarks(){
    Object.values(circles).forEach(c=>{
      c.setAttribute('fill', 'none');
      c.style.transition = 'none';
      c.style.transform = 'scaleY(0)';
      void c.getBoundingClientRect();
      c.style.transition = '';
    });
    Object.values(squares).forEach(row=>{
      row.forEach(({text})=>{
        text.textContent = '';
        text.style.opacity = '0';
      });
    });
  }

  // ---- state ----
  let state = {
    stageAdone:false, stageBdone:false, stageCdone:false, stageDdone:false,
    frame: [],
    framePos: {},
    brush: 'hude',
    baketu: 'baketu',
    sheet: 1,
    availableTubes: ['red']
  };

  const guideBubble = document.getElementById('guideBubble');
  const brushImg = document.getElementById('brushImg');
  const baketuImg = document.getElementById('baketuImg');
  const sheetBgImg = document.getElementById('sheetBgImg');
  const sheetFrameEl = document.getElementById('sheetFrameEl');
  const frameBox = document.getElementById('frameBox');
  const paletteRow = document.getElementById('paletteRow');
  const actionBtn = document.getElementById('actionBtn');
  const toastLine = document.getElementById('toastLine');

  const ITEM_IMG = {
    red: ASSETS.red, white: ASSETS.white, midori: ASSETS.midori, bule: ASSETS.bule,
    baketu_black_item: ASSETS.baketu_black, sheet_item: ASSETS.paper1
  };

  const stageRoot = document.getElementById('stageRoot');
  function shakeScreen(){
    stageRoot.classList.remove('shake');
    void stageRoot.offsetWidth;
    stageRoot.classList.add('shake');
  }

  function renderBrush(){
    brushImg.src = ASSETS[state.brush];
    brushImg.classList.toggle('drag-ready', state.brush !== 'hude');
  }
  function renderBaketu(){ baketuImg.src = ASSETS[state.baketu]; }
  function renderSheetBg(){ sheetBgImg.setAttribute('href', state.sheet===1 ? ASSETS.paper1 : ASSETS.paper2); }

  // ---- generic pointer drag-and-drop ----
  function rectOf(el){ return el.getBoundingClientRect(); }
  function pointInRect(x, y, r){ return x >= r.left && x <= r.right && y >= r.top && y <= r.bottom; }

  function beginDrag(startEvent, ghostSrc, ghostSize, targetEl, onDrop, onMiss){
    startEvent.preventDefault();
    startEvent.stopPropagation();
    const ghost = document.createElement('img');
    ghost.src = ghostSrc;
    Object.assign(ghost.style, {
      position:'fixed', width:ghostSize+'px', height:ghostSize+'px',
      left:(startEvent.clientX - ghostSize/2)+'px', top:(startEvent.clientY - ghostSize/2)+'px',
      pointerEvents:'none', zIndex:9999, opacity:'.92',
      filter:'drop-shadow(0 8px 14px rgba(0,0,0,.5))', borderRadius:'8px'
    });
    document.body.appendChild(ghost);

    function move(e){
      ghost.style.left = (e.clientX - ghostSize/2)+'px';
      ghost.style.top = (e.clientY - ghostSize/2)+'px';
      const over = pointInRect(e.clientX, e.clientY, rectOf(targetEl));
      targetEl.classList.toggle('drag-over', over);
    }
    function up(e){
      document.removeEventListener('pointermove', move);
      document.removeEventListener('pointerup', up);
      ghost.remove();
      targetEl.classList.remove('drag-over');
      const r = rectOf(targetEl);
      if(pointInRect(e.clientX, e.clientY, r)){
        onDrop(e.clientX - r.left, e.clientY - r.top);
      } else if(onMiss){
        onMiss();
      }
    }
    document.addEventListener('pointermove', move);
    document.addEventListener('pointerup', up);
  }

  function addToFrame(id, x, y){
    if(!state.frame.includes(id)){
      state.frame.push(id);
      state.framePos[id] = {x, y};
      renderFrame();
      renderPalette();
      updateGuide();
    }
  }
  function removeFromFrame(id){
    const i = state.frame.indexOf(id);
    if(i > -1){
      state.frame.splice(i,1);
      delete state.framePos[id];
      renderFrame();
      renderPalette();
      updateGuide();
      refreshFinalDragTargets();
    }
  }

  function renderPalette(){
    paletteRow.innerHTML = '';
    state.availableTubes.forEach(id=>{
      const img = document.createElement('img');
      img.src = ITEM_IMG[id];
      img.alt = id;
      const placed = state.frame.includes(id);
      if(placed) img.classList.add('placed');
      img.addEventListener('pointerdown', e=>{
        if(state.frame.includes(id)) return; // already placed, drag from the frame to remove instead
        beginDrag(e, ITEM_IMG[id], 56, frameBox, (x,y)=> addToFrame(id, x, y));
      });
      paletteRow.appendChild(img);
    });
  }

  function renderFrame(){
    frameBox.innerHTML = '';
    const boxW = frameBox.clientWidth, boxH = frameBox.clientHeight;
    const itemSize = 40;
    state.frame.forEach(id=>{
      const img = document.createElement('img');
      img.src = ITEM_IMG[id];
      img.className = 'frame-item';
      img.title = 'ドラッグで動かせます';
      const pos = state.framePos[id] || {x: boxW/2, y: boxH/2};
      const left = Math.max(0, Math.min(boxW - itemSize, pos.x - itemSize/2));
      const top = Math.max(0, Math.min(boxH - itemSize, pos.y - itemSize/2));
      img.style.left = left + 'px';
      img.style.top = top + 'px';
      img.addEventListener('pointerdown', e=>{
        beginDrag(e, ITEM_IMG[id], 44, frameBox,
          (x,y)=>{ state.framePos[id] = {x,y}; renderFrame(); },
          ()=> removeFromFrame(id)
        );
      });
      frameBox.appendChild(img);
    });
    if(document.activeElement === actionBtn) actionBtn.blur();
    actionBtn.disabled = state.frame.length === 0;
  }

  // the real bucket + the real sheet become draggable once stage C is done
  function refreshFinalDragTargets(){
    const active = state.stageCdone && !state.stageDdone;
    const baketuPlaced = state.frame.includes('baketu_black_item');
    const sheetPlaced = state.frame.includes('sheet_item');
    baketuImg.classList.toggle('drag-ready', active && !baketuPlaced);
    sheetFrameEl.classList.toggle('drag-ready', active && !sheetPlaced);
    baketuImg.classList.toggle('placed', baketuPlaced);
    sheetFrameEl.classList.toggle('placed', sheetPlaced);
  }

  baketuImg.addEventListener('pointerdown', e=>{
    if(!(state.stageCdone && !state.stageDdone)) return;
    if(state.frame.includes('baketu_black_item')) return;
    beginDrag(e, ASSETS.baketu_black, 56, frameBox, (x,y)=>{ addToFrame('baketu_black_item', x, y); refreshFinalDragTargets(); });
  });
  sheetFrameEl.addEventListener('pointerdown', e=>{
    if(!(state.stageCdone && !state.stageDdone)) return;
    if(state.frame.includes('sheet_item')) return;
    beginDrag(e, ASSETS.paper1, 56, frameBox, (x,y)=>{ addToFrame('sheet_item', x, y); refreshFinalDragTargets(); });
  });

  function updateGuide(){
    if(state.stageAdone){ guideBubble.classList.add('hidden'); return; }
    guideBubble.classList.remove('hidden');
    guideBubble.textContent = state.frame.includes('red')
      ? '塗るボタンを押してみよう!'
      : 'まずは、赤の絵の具を下の枠に運んでみよう';
  }

  function showToast(msg, kind){
    toastLine.textContent = msg;
    toastLine.className = 'toast' + (kind ? (' ' + kind) : '');
    if(kind === 'err') shakeScreen();
  }

  function setsEqual(a, b){
    if(a.length !== b.length) return false;
    const sa = [...a].sort(), sb = [...b].sort();
    return sa.every((v,i)=> v === sb[i]);
  }

  function completeStageA(){
    paintCircle(1, '#FF0000');
    labelSquare(1,3,'①','#FF0000');

    actionBtn.textContent = '混ぜる';
    state.availableTubes = ['red','white'];
    state.brush = 'hude_red';
    state.stageAdone = true;
    state.frame = []; state.framePos = {};
    renderBrush(); renderPalette(); renderFrame(); updateGuide();
    showToast('ロックが解除された!', 'ok');
  }

  function completeStageB(){
    paintCircle(3, '#FFC0CB');
    labelSquare(3,3,'③','#FFC0CB');

    state.availableTubes = ['red','midori','bule'];
    state.brush = 'hude_pink';
    state.stageBdone = true;
    state.frame = []; state.framePos = {};
    renderBrush(); renderPalette(); renderFrame();
    showToast('ロックが解除された!', 'ok');
  }

  function completeStageC(){
    state.baketu = 'baketu_black';
    state.availableTubes = [];
    state.stageCdone = true;
    state.frame = []; state.framePos = {};
    renderBaketu(); renderPalette(); renderFrame();
    refreshFinalDragTargets();
    showToast('ロックが解除された!', 'ok');
  }

  function completeStageD(){
    state.sheet = 2;
    renderSheetBg();
    // painted right now, at the same instant the paper darkens — made to look like
    // it had quietly been there since the white stage, "revealed" by the dye.
    paintCircleInstant(2, '#FFFFFF');
    labelSquareInstant(2,5,'⑤','#FFFFFF');
    labelSquare(4,3,'②','#FFFFFF');
    labelSquare(4,4,'④','#FFFFFF');
    state.stageDdone = true;
    state.frame = []; state.framePos = {};
    renderFrame();
    refreshFinalDragTargets();
    showToast('ロックが解除された!', 'ok');
    answerBox.classList.remove('hidden');
    answerInput.disabled = false;
    answerSubmit.disabled = false;
  }

  function pressAction(){
    if(state.frame.length === 0) return;

    if(state.brush !== 'hude'){
      showToast('ふでがよごれているので混ぜられない!', 'err');
      return;
    }

    if(!state.stageAdone){
      if(setsEqual(state.frame, ['red'])) completeStageA();
      return;
    }
    if(!state.stageBdone){
      if(state.frame.length === 1){ showToast('混ぜていないようだ。', 'err'); return; }
      if(setsEqual(state.frame, ['red','white'])){ completeStageB(); return; }
      showToast('文字数が違うようだ。', 'err');
      return;
    }
    if(!state.stageCdone){
      if(state.frame.length === 1){ showToast('混ぜていないようだ。', 'err'); return; }
      if(setsEqual(state.frame, ['red','midori','bule'])){ completeStageC(); return; }
      showToast('文字数が違うようだ。', 'err');
      return;
    }
    if(!state.stageDdone){
      if(state.frame.length === 1){ showToast('混ぜていないようだ。', 'err'); return; }
      if(setsEqual(state.frame, ['baketu_black_item','sheet_item'])){ completeStageD(); return; }
      showToast('文字数が違うようだ。', 'err');
      return;
    }
  }

  const BRUSH_TO_NEXT_BAKETU = { hude_red: 'baketu_red', hude_pink: 'baketu_koraru' };
  const BRUSH_DIRTY_COLOR = { hude_red: '#c0392b', hude_pink: '#e08a9c' };
  const washSpinner = document.getElementById('washSpinner');

  brushImg.addEventListener('pointerdown', e=>{
    if(state.brush === 'hude') return; // already clean, nothing to wash
    e.preventDefault();
    e.stopPropagation();

    const dirty = state.brush;
    const ghostSize = 56;
    const ghost = document.createElement('img');
    ghost.src = ASSETS[dirty];
    Object.assign(ghost.style, {
      position:'fixed', width:ghostSize+'px', height:ghostSize+'px',
      left:(e.clientX - ghostSize/2)+'px', top:(e.clientY - ghostSize/2)+'px',
      pointerEvents:'none', zIndex:9999, opacity:'.92',
      filter:'drop-shadow(0 8px 14px rgba(0,0,0,.5))', borderRadius:'8px'
    });
    document.body.appendChild(ghost);
    brushImg.style.visibility = 'hidden'; // the brush has left its holder while being dragged

    let isSpinning = false;
    let spinTimer = null;

    function startSpin(){
      isSpinning = true;
      washSpinner.style.setProperty('--spin-color', BRUSH_DIRTY_COLOR[dirty] || '#999');
      washSpinner.style.transition = 'none';
      washSpinner.style.setProperty('--p', '0deg');
      washSpinner.classList.add('active');
      void washSpinner.offsetWidth;
      washSpinner.style.transition = '';
      requestAnimationFrame(()=>{ washSpinner.style.setProperty('--p', '360deg'); });
      spinTimer = setTimeout(completeWash, 1600);
    }

    function cancelSpin(){
      if(!isSpinning) return;
      isSpinning = false;
      clearTimeout(spinTimer);
      washSpinner.style.transition = 'none';
      washSpinner.style.setProperty('--p', '0deg');
      washSpinner.classList.remove('active');
      void washSpinner.offsetWidth;
      washSpinner.style.transition = '';
    }

    function completeWash(){
      document.removeEventListener('pointermove', move);
      document.removeEventListener('pointerup', up);
      isSpinning = false;
      washSpinner.classList.remove('active');
      ghost.remove();
      const nextBaketu = BRUSH_TO_NEXT_BAKETU[dirty];
      state.brush = 'hude';
      renderBrush(); // also clears the hidden-while-dragging visibility via a fresh src
      brushImg.style.visibility = '';
      if(nextBaketu){
        state.baketu = nextBaketu;
        renderBaketu();
      }
      showToast('筆をゆすいだ!', 'ok');
    }

    function move(ev){
      ghost.style.left = (ev.clientX - ghostSize/2)+'px';
      ghost.style.top = (ev.clientY - ghostSize/2)+'px';
      const over = pointInRect(ev.clientX, ev.clientY, rectOf(baketuImg));
      if(over && !isSpinning) startSpin();
      else if(!over && isSpinning) cancelSpin();
    }
    function up(){
      document.removeEventListener('pointermove', move);
      document.removeEventListener('pointerup', up);
      cancelSpin();
      ghost.remove();
      brushImg.style.visibility = '';
    }
    document.addEventListener('pointermove', move);
    document.addEventListener('pointerup', up);
  });

  actionBtn.addEventListener('click', ()=>{
    const sx = window.scrollX, sy = window.scrollY;
    pressAction();
    // whatever is triggering the jump-to-bottom on mobile (focus handling on the
    // now-disabled button, most likely), just force the scroll position back.
    requestAnimationFrame(()=> window.scrollTo(sx, sy));
    setTimeout(()=> window.scrollTo(sx, sy), 60);
  });

  // ---- answer check ----
  const ANSWER = 'DANCE';
  const answerBox = document.getElementById('answerBox');
  const answerInput = document.getElementById('answerInput');
  const answerSubmit = document.getElementById('answerSubmit');
  const answerStatus = document.getElementById('answerStatus');
  let retryCount = 0;
  function toHalfWidth(str){
    return str.replace(/[Ａ-Ｚａ-ｚ０-９]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0));
  }
  function checkAnswer(){
    const normalized = toHalfWidth(answerInput.value).trim().toUpperCase();
    answerStatus.classList.remove('correct','wrong');
    if(normalized === ANSWER){
      answerStatus.textContent = '正解!';
      answerStatus.classList.add('correct');
      showSuccessOverlay();
    } else if(normalized.length > 0){
      answerStatus.textContent = 'ちがうみたい…';
      answerStatus.classList.add('wrong');
      shakeScreen();
    }
  }
  answerSubmit.addEventListener('click', checkAnswer);
  answerInput.addEventListener('keydown', e=>{ if(e.key==='Enter') checkAnswer(); });

  // ---- success overlay + share ----
  const successOverlay = document.getElementById('successOverlay');
  const retryCountLabel = document.getElementById('retryCountLabel');
  const shareBtn = document.getElementById('shareBtn');
  const successCloseBtn = document.getElementById('successCloseBtn');
  const shareNote = document.getElementById('shareNote');

  function showSuccessOverlay(){
    retryCountLabel.textContent = String(retryCount);
    shareNote.textContent = '';
    successOverlay.classList.remove('hidden');
  }
  successCloseBtn.addEventListener('click', ()=> successOverlay.classList.add('hidden'));

  function shareUrl(){
    const url = location.origin + location.pathname;
    return url;
  }
  shareBtn.addEventListener('click', async ()=>{
    const url = shareUrl();
    const text = `「染色」を正解しました!やり直した回数:${retryCount}回`;
    shareNote.textContent = '';

    if(navigator.share){
      try{
        await navigator.share({ title:'染色', text, url });
        return; // shared successfully
      }catch(err){
        if(err && err.name === 'AbortError') return; // user cancelled on purpose
        // any other failure falls through to the clipboard/text fallback below
      }
    }
    if(navigator.clipboard && navigator.clipboard.writeText){
      try{
        await navigator.clipboard.writeText(`${text}\n${url}`);
        shareNote.textContent = 'リンクをコピーしました!';
        return;
      }catch(err){ /* fall through to plain text below */ }
    }
    shareNote.textContent = url;
  });

  // ---- reset ----
  const resetBtn = document.getElementById('resetBtn');
  function resetAll(){
    retryCount += 1;
    state = {
      stageAdone:false, stageBdone:false, stageCdone:false, stageDdone:false,
      frame: [], framePos: {},
      brush: 'hude', baketu: 'baketu', sheet: 1,
      availableTubes: ['red']
    };
    resetMarks();
    actionBtn.textContent = '塗る';
    renderBrush(); renderBaketu(); renderSheetBg();
    renderPalette(); renderFrame(); updateGuide();
    refreshFinalDragTargets();
    showToast('');
    answerInput.value = '';
    answerInput.disabled = true;
    answerSubmit.disabled = true;
    answerBox.classList.add('hidden');
    answerStatus.textContent = '';
    answerStatus.classList.remove('correct','wrong');
    successOverlay.classList.add('hidden');
  }
  resetBtn.addEventListener('click', resetAll);

  // ---- help panel ----
  const helpBtn = document.getElementById('helpBtn');
  const helpPanel = document.getElementById('helpPanel');
  const helpClose = document.getElementById('helpClose');
  helpBtn.addEventListener('click', ()=> helpPanel.classList.toggle('hidden'));
  helpClose.addEventListener('click', ()=> helpPanel.classList.add('hidden'));

  // ---- init ----
  renderPalette();
  renderFrame();
  renderBrush();
  renderBaketu();
  renderSheetBg();
  updateGuide();
})();
</script>
</body>
</html>
